# Fly.io deploy config for regulatory-comment-intelligence-hub.
#
# ESCALATION (do not auto-deploy): `fly deploy` requires
#   1. Miz's Fly API token (FLY_API_TOKEN) — supplied by Miz at deploy time.
#   2. src/app.ts must bind 0.0.0.0 (currently 127.0.0.1 — Codex lane; tracked in an issue).
# Until both land, this config is staged-ready but not deployed.
app = "regulatory-comment-intelligence-hub"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  PORT = "8080"
  NODE_ENV = "production"
