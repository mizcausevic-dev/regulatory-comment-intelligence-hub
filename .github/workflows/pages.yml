name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prerender
      - name: SEO assets (robots.txt + sitemap.xml)
        run: |
          DOMAIN=$(2>/dev/null tr -d '[:space:]' < site/CNAME)
          if [ -n "$DOMAIN" ]; then
            printf 'User-agent: *\nAllow: /\nSitemap: https://%s/sitemap.xml\n' "$DOMAIN" > site/robots.txt
            TODAY=$(date -u +%Y-%m-%d)
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
              for f in site/*.html; do
                n=$(basename "$f")
                if [ "$n" = "index.html" ]; then loc="https://$DOMAIN/"; else loc="https://$DOMAIN/$n"; fi
                echo "  <url><loc>$loc</loc><lastmod>$TODAY</lastmod></url>"
              done
              echo '</urlset>'
            } > site/sitemap.xml
            echo "wrote site/robots.txt + site/sitemap.xml for $DOMAIN"
            node scripts/seo-meta.mjs "$DOMAIN"
          else
            echo "no CNAME -> skipping SEO assets"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
